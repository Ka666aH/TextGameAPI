name: CI

# Один и тот же workflow работает как обычный CI (push/PR) и как переиспользуемый
# набор тестов для релиза: release.yml вызывает его через `uses`.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: text_game_db
          POSTGRES_USER: text_game
          POSTGRES_PASSWORD: text_game_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U text_game -d text_game_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Интеграционные тесты используют эти адреса и не поднимают свои контейнеры.
      TEXTGAME_TEST_POSTGRES: Host=localhost;Port=5432;Database=text_game_db;Username=text_game;Password=text_game_password
      TEXTGAME_TEST_REDIS: localhost:6379
      JwtSettings__Secret: ci-secret-key-at-least-32-characters-long
      Logging__EventLog__LogLevel__Default: None

    steps:
      - uses: actions/checkout@v4

      # SDK 10 нужен для `dotnet test --project` (Microsoft.Testing.Platform из global.json).
      # SDK 8 — целевая платформа приложения (net8.0).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore TextGame.Tests/TextGame.Tests.csproj

      - name: Build tests (and the API project they reference)
        run: dotnet build TextGame.Tests/TextGame.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test --project TextGame.Tests/TextGame.Tests.csproj -c Release --no-build
