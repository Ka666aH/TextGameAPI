name: Release

# Релиз запускается только пушем тега v* (например, v1.1.0).
# Тесты обязаны пройти до публикации образа.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # создание GitHub Release

env:
  IMAGE_NAME: ka666ah/text-game-api

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image and GitHub release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.1.0 -> 1.1.0, 1.1, latest
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./TextGameAPI
          file: ./TextGameAPI/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "TextGameAPI $GITHUB_REF_NAME" \
            --generate-notes
